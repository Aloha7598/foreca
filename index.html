   +(hh.down&&hh.down.length?'<div style="margin-top:6px">'+hh.down.map(function(n){return '<span class="tag" style="border-color:#5a1010;color:#ff9d9d">'+esc(n)+'</span>';}).join("")+'</div>':'')+'</div>';
  h+='<div class="card klist">'+(hh.groups||[]).map(function(g){return '<div class="row"><span>'+esc(g.group)+'</span><span class="spacer"></span><span class="sub"><span class="ok">'+g.up+'↑</span>'+(g.down?' <span class="dn">'+g.down+'↓</span>':'')+'</span></div>';}).join("")+'</div>';
  h+='<h2>Ingest (auto scan + transcribe)</h2>';
  h+='<div class="card"><div class="row"><span class="lbl">Last run</span><span class="spacer"></span><span class="sub">'+esc(ing.lastRun||"—")+'</span></div>'
   +'<div class="row" style="margin-top:4px"><span class="lbl">Landed last run</span><span class="spacer"></span><span class="sc">'+(ing.lastRunLanded!=null?ing.lastRunLanded:"—")+'</span></div>'
   +'<div class="row" style="margin-top:4px"><span class="lbl">Total</span><span class="spacer"></span><span class="sub">'+ing.totalTranscribed+' transcribed · '+ing.totalRemaining+' remaining</span></div></div>';
  h+='<div class="card klist">'+(ing.channels||[]).slice(0,25).map(function(c){var pct=c.windowLen?Math.round(c.transcribed/c.windowLen*100):0;return '<div class="row"><span>'+esc(c.name)+(c.done?' <span class="pill b-inv">DONE</span>':'')+'</span><span class="spacer"></span><span class="sub">'+c.transcribed+'/'+c.windowLen+(c.remaining?' · '+c.remaining+' left':'')+'</span></div>';}).join("")+'</div>';
  document.getElementById("tab-health").innerHTML=h;
}

renderEmerging(); renderPaper(); renderTiers(); renderHealth();
var tabs=["emerging","paper","tiers","health"];
document.querySelectorAll("nav button").forEach(function(b){ b.onclick=function(){
  var t=b.dataset.t; tabs.forEach(function(x){ document.getElementById("tab-"+x).classList.toggle("hide",x!==t); });
  document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x===b);});
  window.scrollTo(0,0); if(TG&&TG.HapticFeedback){try{TG.HapticFeedback.selectionChanged();}catch(e){}}
};});
</script></body></html>
