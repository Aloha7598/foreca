/* ---------- FORECAST ---------- */
function fpct(v){ return (v==null||isNaN(v))?"—":((v>0?"+":"")+(Math.round(v*1000)/10)+"%"); }
function fnum(v){ if(v==null||isNaN(v))return"—"; v=+v; if(v>=1000)return v.toLocaleString(undefined,{maximumFractionDigits:0}); if(v>=1)return (Math.round(v*100)/100); return (Math.round(v*1e4)/1e4); }
function fcCard(c,queued){
  var lg=c.dir==="long";
  var dirTag='<span class="tk '+(lg?"lg":"sh")+'">'+(lg?"▲ LONG":"▼ SHORT")+'</span>';
  var venue=c.venue?'<span class="vch '+(queued?"q":"l")+'">'+(c.badge?c.badge+" ":"")+esc(c.venue)+' · '+(queued?"QUEUED":"LIVE")+'</span>':'';
  var ret=c.markRet;
  var big=queued?'<span class="dim">pending</span>':'<span class="'+((ret||0)>=0?"ok":"dn")+'" style="font-weight:800;font-size:15px">'+fpct(ret)+'</span>';
  var posln=c.vsym?('<div class="meta" style="margin-top:5px">'+(queued
     ? '⏳ order queued on <b>'+esc(c.vsym)+'</b> — fills at next market open'
     : '● filled on <b>'+esc(c.vsym)+'</b>'+(c.avg!=null?' @ <b>'+fnum(c.avg)+'</b>':''))+'</div>'):'';
  var peak=(!queued&&c.peakRet!=null)?' · peak '+fpct(c.peakRet):'';
  return '<div class="card'+(queued?"":" ris")+'">'
    +'<div class="row">'+dirTag+'<span class="nm" style="margin-left:2px">'+esc(c.asset)+'</span><span class="sub">'+esc(c.label)+'</span><span class="spacer"></span>'+big+'</div>'
    +(venue?'<div style="margin-top:5px">'+venue+'</div>':'')
    +'<div class="meta" style="margin-top:5px">entry '+fnum(c.entry)+' → target '+fnum(c.target)+' · inval '+fnum(c.invalidation)+' · RR '+(c.rr!=null?c.rr:"—")+'</div>'
    +'<div class="sub" style="margin-top:2px">conf '+(c.conf!=null?Math.round(c.conf*100)+"%":"—")+' · p '+(c.p!=null?Math.round(c.p*100)+"%":"—")+' · '+ago(c.firedISO)+peak+'</div>'
    +posln
    +(c.tldr?'<div class="what" style="margin-top:6px">'+esc(c.tldr)+'</div>':'')
    +'</div>';
}
function renderForecast(){
  var F=D.forecast||{inTrade:[],queued:[],watch:[]};
  var h='<div class="stat">'
    +'<div class="card"><div class="lbl">📈 In trade</div><div class="big" style="color:var(--grn)">'+(F.inTrade||[]).length+'</div><div class="sub">filled positions</div></div>'
    +'<div class="card"><div class="lbl">🕘 Queued</div><div class="big" style="color:var(--amb)">'+(F.queued||[]).length+'</div><div class="sub">awaiting open</div></div>'
    +'</div>';
  if(F.generatedAt) h+='<div class="sub" style="margin:4px 4px 0">updated '+esc((F.generatedAt||"").slice(0,16).replace("T"," "))+'</div>';
  h+='<h2>📈 In trade — live positions</h2>';
  h+=(F.inTrade&&F.inTrade.length)?F.inTrade.map(function(c){return fcCard(c,false);}).join(""):'<div class="sub" style="padding:8px 4px">no live forecast positions right now.</div>';
  h+='<h2>🕘 Queued — waiting to fill</h2>';
  h+=(F.queued&&F.queued.length)?F.queued.map(function(c){return fcCard(c,true);}).join(""):'<div class="sub" style="padding:8px 4px">no queued orders. TradFi orders placed while US markets are closed appear here.</div>';
  document.getElementById("tab-forecast").innerHTML=h;
}

renderLive(); renderForecast(); renderEmerging(); renderTiers(); renderHealth();
var tabs=["live","forecast","emerging","tiers","health"];
document.querySelectorAll("nav button").forEach(function(b){ b.onclick=function(){
  var t=b.dataset.t; tabs.forEach(function(x){ document.getElementById("tab-"+x).classList.toggle("hide",x!==t); });
  document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x===b);});
  window.scrollTo(0,0); if(TG&&TG.HapticFeedback){try{TG.HapticFeedback.selectionChanged();}catch(e){}}
};});
</script></body></html>
