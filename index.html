function emergingCard(e){

    +(isTheme?'<span class="badge b-tm">🔗 THEME</span>':(e.highConv?'<span class="badge b-hc">🔥 HIGH-CONV</span>':'<span class="badge b-inv">investable</span>'));

     +(e.playVia||[]).map(function(v){return '<span class="chip"><b>'+esc(v[0])+'</b></span>';}).join("")+'</div></div>'):'';
  var verdict=e.verdict?('<details><summary>Deep-dive verdict ▾</summary><div class="verdict">'+esc(e.verdict)+'</div></details>'):'';
  return '<div class="card '+(isTheme?"tm":"ris")+(e.highConv?" hc":"")+'"><div class="row"><span class="nm">'+esc(e.name)+'</span>'+badges+'<span class="spacer"></span><span class="sc">'+e.score+'</span></div>'

}

    var m=(r.netMult!=null?r.netMult:(r.mult!=null?r.mult:(r.peakX!=null?r.peakX:(r.ret!=null?r.ret:null))));
    return '<div class="card"><div class="lbl">'+t+'</div><div style="margin-top:3px;color:'+c+'">'+esc(sid)+(m!=null?' · '+esc(m)+(String(m).indexOf("x")<0?"x":""):"")+'</div></div>'; }
  h+=bw("Best",p.best,"var(--grn)")+bw("Worst",p.worst,"var(--red)");
  document.getElementById("tab-paper").innerHTML=h;
}

/* ---------- ROBOTS ---------- */
function renderRobots(){
  var R=D.robots||{list:[]};
  var kd={wrote:"var(--grn)", idle:"var(--dim)", error:"var(--red)", ran:"var(--blu)", info:"var(--blu)"};
  var h=(R.list||[]).map(function(r){
    var evs=r.events||[];
    var log=evs.length? evs.map(function(e){
      return '<div class="erow"><div class="row" style="gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:'+(kd[e.kind]||"var(--blu)")+';flex:none"></span><span class="dim" style="font-size:10px">'+esc(e.ts)+'</span></div><div class="esnip">'+esc(e.detail)+'</div></div>';
    }).join(""):'<div class="sub" style="padding:6px 0">no activity logged yet \u2014 fills in after the next run.</div>';
    return '<div class="card"><div class="row"><span style="font-size:18px">'+esc(r.ic)+'</span><span class="nm" style="font-size:14px;margin-left:2px">'+esc(r.name)+'</span><span class="spacer"></span><span class="tag" style="margin:0">'+esc(r.sched)+'</span></div>'
      +'<div class="what">'+esc(r.blurb)+'</div>'
      +'<div class="card klist" style="margin:6px 0 0;background:#0d1119">'+log+'</div></div>';
  }).join("");
  document.getElementById("tab-robots").innerHTML=h||'<div class="sub" style="padding:8px 4px">no robots.</div>';
}

/* ---------- HEALTH ---------- */
function renderHealth(){
  var hh=D.health||{groups:[]}, ing=D.ingest||{channels:[]};
  var h='<div class="card"><div class="row"><span class="lbl">System</span><span class="spacer"></span><span class="'+(hh.allUp?"ok":"dn")+'" style="font-weight:800">'+(hh.allUp?"ALL UP":(hh.down.length+" DOWN"))+'</span></div><div class="sub" style="margin-top:4px">'+hh.upN+' / '+hh.all+' components up</div>'
   +(hh.down&&hh.down.length?'<div style="margin-top:6px">'+hh.down.map(function(n){return '<span class="tag" style="border-color:#5a1010;color:#ff9d9d">'+esc(n)+'</span>';}).join("")+'</div>':'')+'</div>';
  h+='<div class="card klist">'+(hh.groups||[]).map(function(g){return '<div class="row"><span>'+esc(g.group)+'</span><span class="spacer"></span><span class="sub"><span class="ok">'+g.up+'↑</span>'+(g.down?' <span class="dn">'+g.down+'↓</span>':'')+'</span></div>';}).join("")+'</div>';
  h+='<h2>Ingest (auto scan + transcribe)</h2>';
  h+='<div class="card"><div class="row"><span class="lbl">Last run</span><span class="spacer"></span><span class="sub">'+esc(ing.lastRun||"—")+'</span></div>'
   +'<div class="row" style="margin-top:4px"><span class="lbl">Landed last run</span><span class="spacer"></span><span class="sc">'+(ing.lastRunLanded!=null?ing.lastRunLanded:"—")+'</span></div>'
   +'<div class="row" style="margin-top:4px"><span class="lbl">Total</span><span class="spacer"></span><span class="sub">'+ing.totalTranscribed+' transcribed · '+ing.totalRemaining+' remaining</span></div></div>';
  h+='<div class="card klist">'+(ing.channels||[]).slice(0,25).map(function(c){var pct=c.windowLen?Math.round(c.transcribed/c.windowLen*100):0;return '<div class="row"><span>'+esc(c.name)+(c.done?' <span class="pill b-inv">DONE</span>':'')+'</span><span class="spacer"></span><span class="sub">'+c.transcribed+'/'+c.windowLen+(c.remaining?' · '+c.remaining+' left':'')+'</span></div>';}).join("")+'</div>';
  document.getElementById("tab-health").innerHTML=h;
}

/* ---------- LIVE ---------- */
function fmtMc(v){ if(v==null||isNaN(v))return"—"; v=+v; if(v>=1e6)return "$"+(v/1e6).toFixed(2)+"M"; if(v>=1e3)return "$"+(v/1e3).toFixed(1)+"K"; return "$"+Math.round(v); }
function fmtK(v){ if(v==null||isNaN(v))return"—"; v=+v; return v>=1000?"$"+(v/1000).toFixed(2)+"M":"$"+v.toFixed(1)+"K"; }
function ago(ts){ if(!ts)return""; var t=(typeof ts==="number")?ts:Date.parse(ts); if(isNaN(t))return""; var s=(Date.now()-t)/1000; if(s<0)return"now"; if(s<3600)return Math.max(1,Math.round(s/60))+"m ago"; if(s<86400)return Math.round(s/3600)+"h ago"; return Math.round(s/86400)+"d ago"; }
function pnlStr(v){ return v==null?"—":((v>0?"+":"")+(Math.round(v*10)/10)+"%"); }
function renderLive(){
  var L=D.live||{fired:[],inTrade:[],closed:[]};
  var nClosed=L.closedN!=null?L.closedN:(L.closed||[]).length;
  var h='<div class="nstat n3">'
    +'<div class="ntile"><div class="lbl">🔥 Fired</div><div class="nbig">'+(L.nFired!=null?L.nFired:(L.fired||[]).length)+'</div><div class="nsub">'+(L.nLiveFired||0)+' live now</div></div>'
    +'<div class="ntile"><div class="lbl">📈 In trade</div><div class="nbig" style="color:var(--blu)">'+((L.inTrade||[]).length)+'</div><div class="nsub">open</div></div>'
    +'<div class="ntile"><div class="lbl">✅ Closed</div><div class="nbig">'+nClosed+'</div><div class="nsub"><span class="ok">'+(L.closedWins||0)+'W</span> · <span class="dn">'+(nClosed-(L.closedWins||0))+'L</span></div></div>'
    +'</div>';
  if(L.generated) h+='<div class="sub" style="margin:4px 4px 0">signals snapshot: '+esc(L.generated)+'</div>';
  h+='<h2>📈 In trade — open now</h2>';
  h+=(L.inTrade&&L.inTrade.length)?L.inTrade.map(function(t){
      return '<div class="card ris"><div class="row"><span class="nm">'+esc(t.sym||"?")+'</span><span class="pill b-inv">OPEN</span><span class="spacer"></span><span class="sub">'+ago(t.ts)+'</span></div><div class="meta">entry MC '+fmtMc(t.emc)+(t.src?' · via '+esc(t.src):'')+'</div></div>';
    }).join(""):'<div class="sub" style="padding:8px 4px">no open positions right now.</div>';
  h+='<h2>🔥 Fired signals</h2>';
  h+=(L.fired&&L.fired.length)?L.fired.map(function(c){
      var sp=c.live?'<span class="pill b-inv">LIVE</span>':'<span class="pill" style="color:var(--dim);border:1px solid var(--line)">CLOSED</span>';
      var r1='<span class="tag" style="'+(c.r1?"border-color:#1c5a3c;color:var(--grn)":"color:var(--dim)")+'">R1 '+(c.r1?"✓":"✗")+'</span>';
      var r2='<span class="tag" style="'+(c.r2?"border-color:#1c5a3c;color:var(--grn)":"color:var(--dim)")+'">R2 '+(c.r2?"✓":"✗")+'</span>';
      var pc=(c.pnl>0)?"var(--grn)":((c.pnl<0)?"var(--red)":"var(--dim)");
      return '<div class="card'+(c.live?" ris":"")+'"><div class="row"><span class="nm">'+esc(c.sym||"?")+'</span>'+sp+'<span class="spacer"></span><span class="sc" style="color:'+((c.peakX>=1.0)?"var(--grn)":"var(--dim)")+'">'+(c.peakX!=null?c.peakX+"x":"")+'</span></div><div class="meta">entry '+fmtMc(c.entry)+' → peak '+fmtMc(c.peak)+' · last '+fmtMc(c.lastMc)+'</div><div style="margin-top:5px">'+r1+r2+'<span class="tag" style="color:'+pc+'">P&L '+pnlStr(c.pnl)+'</span>'+(c.sa?'<span class="tag">'+esc(c.sa)+'</span>':'')+'</div><div class="sub" style="margin-top:4px">'+ago(c.ts)+'</div></div>';
    }).join(""):'<div class="sub" style="padding:8px 4px">nothing fired in the current snapshot.</div>';
  h+='<h2>✅ Closed — resolved outcomes</h2>';
  h+='<div class="card klist">'+((L.closed&&L.closed.length)?L.closed.map(function(c){
      var col=(c.pnl>0)?"ok":"dn";
      return '<div class="row"><span class="nm" style="font-size:13px">'+esc(c.t||"?")+'</span><span class="sub" style="margin-left:8px">'+fmtK(c.mc)+' → '+fmtK(c.liq)+'</span><span class="spacer"></span><span class="'+col+'" style="font-weight:800">'+pnlStr(c.pnl)+'</span></div>';
    }).join(""):'<div class="sub">no closes recorded.</div>')+'</div>';
  var SB=D.scoreboard||{days:[]};
  h+='<h2>🗓️ Daily scoreboard — last 7 days</h2>';
  h+=(SB.days&&SB.days.length)?SB.days.map(function(day){
      var uc=(day.usd>=0)?"ok":"dn";
      var head='<div class="row" style="padding:1px 0"><span class="nm" style="font-size:13px">'+esc(day.date)+'</span><span class="sub" style="margin-left:6px">'+day.n+' calls</span><span class="spacer"></span><span class="ok" style="font-weight:700">'+day.w+'W</span><span class="dim">·</span><span class="dn" style="font-weight:700">'+day.l+'L</span><span class="'+uc+'" style="font-weight:800;margin-left:8px">'+(day.usd>=0?"+":"-")+'$'+Math.abs(day.usd).toFixed(2)+'</span></div>';
      var rows=(day.rows||[]).map(function(r){
        var pc=(r.pnl>0)?"ok":"dn"; var up=((r.pnlUsd||0)>=0);
        return '<div class="sbrow"><div class="row" style="gap:5px"><span class="nm" style="font-size:12px">'+esc(r.tok)+'</span><span class="pill" style="border:1px solid var(--line);color:'+(r.sa==="HIT"?"var(--grn)":"var(--red)")+'">'+esc(r.sa)+'</span>'+(r.paper?'<span class="pill" style="border:1px solid #4a3a6a;color:var(--pur)">P</span>':'')+'<span class="spacer"></span><span class="'+pc+'" style="font-weight:700">'+pnlStr(r.pnl)+'</span><span class="'+(up?"ok":"dn")+'" style="font-weight:800;min-width:58px;text-align:right">'+(up?"+":"-")+'$'+Math.abs(r.pnlUsd||0).toFixed(2)+'</span></div>'
          +'<div class="sub" style="margin-top:2px">'+esc(r.panel||"")+' · '+(r.subfloor?"sub-floor":"floor")+' · R1 '+(r.r1?"✓":"✗")+' · R2 '+(r.r2?"✓":"✗")+(r.ver?' · '+esc(r.ver):'')+'</div></div>';
      }).join("");
      return '<div class="card">'+head+'<div style="margin-top:5px">'+rows+'</div></div>';
    }).join(""):'<div class="sub" style="padding:8px 4px">no scoreboard data yet.</div>';
  document.getElementById("tab-live").innerHTML=h;
}

/* ---------- FORECAST ---------- */
function fpct(v){ return (v==null||isNaN(v))?"—":((v>0?"+":"")+(Math.round(v*1000)/10)+"%"); }
function fnum(v){ if(v==null||isNaN(v))return"—"; v=+v; if(v>=1000)return v.toLocaleString(undefined,{maximumFractionDigits:0}); if(v>=1)return (Math.round(v*100)/100); return (Math.round(v*1e4)/1e4); }
function fcCard(c,queued){
  var lg=c.dir==="long";
  var dirTag='<span class="tk '+(lg?"lg":"sh")+'">'+(lg?"▲ LONG":"▼ SHORT")+'</span>';
  var venue=c.venue?'<span class="vch '+(queued?"q":"l")+'">'+(c.badge?c.badge+" ":"")+esc(c.venue)+' · '+(queued?"QUEUED":"LIVE")+'</span>':'';
  var ret=c.markRet;
  var big=queued?'<span class="dim">pending</span>':'<span class="'+((ret||0)>=0?"ok":"dn")+'" style="font-weight:800;font-size:15px">'+fpct(ret)+'</span>';
  var posln=c.vsym?('<div class="meta" style="margin-top:5px">'+(queued
     ? '⏳ order queued on <b>'+esc(c.vsym)+'</b> — fills at next market open'
     : '● filled on <b>'+esc(c.vsym)+'</b>'+(c.avg!=null?' @ <b>'+fnum(c.avg)+'</b>':''))+'</div>'):'';
  var peak=(!queued&&c.peakRet!=null)?' · peak '+fpct(c.peakRet):'';
  return '<div class="card'+(queued?"":" ris")+'">'
    +'<div class="row">'+dirTag+'<span class="nm" style="margin-left:2px">'+esc(c.asset)+'</span><span class="sub">'+esc(c.label)+'</span><span class="spacer"></span>'+big+'</div>'
    +(venue?'<div style="margin-top:5px">'+venue+'</div>':'')
    +'<div class="meta" style="margin-top:5px">entry '+fnum(c.entry)+' → target '+fnum(c.target)+' · inval '+fnum(c.invalidation)+' · RR '+(c.rr!=null?c.rr:"—")+'</div>'
    +'<div class="sub" style="margin-top:2px">conf '+(c.conf!=null?Math.round(c.conf*100)+"%":"—")+' · p '+(c.p!=null?Math.round(c.p*100)+"%":"—")+' · '+ago(c.firedISO)+peak+'</div>'
    +posln
    +(c.tldr?'<div class="what" style="margin-top:6px">'+esc(c.tldr)+'</div>':'')
    +'</div>';
}
function renderForecast(){
  var F=D.forecast||{inTrade:[],queued:[],watch:[]};
  var h='<div class="stat">'
    +'<div class="card"><div class="lbl">📈 In trade</div><div class="big" style="color:var(--grn)">'+(F.inTrade||[]).length+'</div><div class="sub">filled positions</div></div>'
    +'<div class="card"><div class="lbl">🕘 Queued</div><div class="big" style="color:var(--amb)">'+(F.queued||[]).length+'</div><div class="sub">awaiting open</div></div>'
    +'</div>';
  if(F.generatedAt) h+='<div class="sub" style="margin:4px 4px 0">updated '+esc((F.generatedAt||"").slice(0,16).replace("T"," "))+'</div>';
  h+='<h2>📈 In trade — live positions</h2>';
  h+=(F.inTrade&&F.inTrade.length)?F.inTrade.map(function(c){return fcCard(c,false);}).join(""):'<div class="sub" style="padding:8px 4px">no live forecast positions right now.</div>';
  h+='<h2>🕘 Queued — waiting to fill</h2>';
  h+=(F.queued&&F.queued.length)?F.queued.map(function(c){return fcCard(c,true);}).join(""):'<div class="sub" style="padding:8px 4px">no queued orders. TradFi orders placed while US markets are closed appear here.</div>';
  document.getElementById("tab-forecast").innerHTML=h;
}

/* ---------- NEWS INTEL ---------- */
function sparkMini(spark){ var w=140,h=30,n=(spark||[]).length; if(!n)return""; var mx=Math.max.apply(null,spark)||1,pts=[]; for(var i=0;i<n;i++){var x=(n>1?i/(n-1):0)*w; var y=h-2-(spark[i]/mx)*(h-6); pts.push(x.toFixed(1)+","+y.toFixed(1));} return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:30px;display:block;margin-top:3px"><polyline points="'+pts.join(" ")+'" fill="none" stroke="#26d07c" stroke-width="1.6"/></svg>'; }
function ndir(l){ if(l>0.15)return["▲","ok"]; if(l<-0.15)return["▼","dn"]; return["►","dim"]; }
function renderNews(){
  var N=D.news||{heat:[],feed:[],emerging:[],alts:[]};
  var h='<div class="nstat">'
    +'<div class="ntile"><div class="lbl">Posts</div><div class="nbig">'+(N.posts||0)+'</div></div>'
    +'<div class="ntile"><div class="lbl">Channels</div><div class="nbig">'+(N.channels||0)+'</div></div>'
    +'<div class="ntile"><div class="lbl">Narratives</div><div class="nbig">'+(N.activeNarratives||0)+'</div><div class="nsub">&ge;2 ch</div></div>'
    +'<div class="ntile"><div class="lbl">Events</div><div class="nbig">'+(N.events||0)+'</div><div class="nsub">'+(N.evOff||0)+' off · '+(N.evOn||0)+' on</div></div>'
    +'</div>';
  if(N.generated) h+='<div class="sub" style="margin:4px 4px 0">updated '+esc((N.generated||"").slice(0,16).replace("T"," "))+'</div>';
  h+='<h2>🔥 Narrative heat — heating</h2>';
  h+=(N.heat&&N.heat.length)?('<div class="hgrid3">'+N.heat.map(function(x){
      var vd=ndir(x.vel), sd=ndir(x.sent);
      var sc=x.score>=80?"var(--grn)":(x.score>=50?"var(--amb)":"var(--dim)");
      return '<div class="card"><div class="row"><span class="nm" style="font-size:13px">'+esc(x.t)+'</span><span class="pill" style="color:#ff8a5c;border:1px solid #5a2a18;background:#2a140f">🔥 heating</span><span class="spacer"></span><span class="sc" style="color:'+sc+'">'+x.score+'</span></div>'
        +'<div class="hbar"><i style="width:'+x.score+'%"></i></div>'
        +sparkMini(x.spark)
        +'<div class="sub" style="margin-top:3px"><span class="'+vd[1]+'">'+vd[0]+' vel</span> · <span class="'+sd[1]+'">'+sd[0]+' '+x.bull+'▲/'+x.bear+'▼</span> · '+x.C+' ch · '+x.n+'×</div></div>';
    }).join("")+'</div>'):'<div class="sub" style="padding:8px 4px">nothing heating right now.</div>';
  h+='<h2>📰 Event feed — typed, risk direction</h2>';
  h+='<div class="card klist">'+((N.feed&&N.feed.length)?N.feed.map(function(e){
      var on=e.dir==="on",off=e.dir==="off"; var cls=off?"dn":(on?"ok":"sub2"); var lab=off?"RISK-OFF":(on?"RISK-ON":"WATCH");
      return '<div class="erow"><div class="row" style="gap:6px"><span class="etype '+cls+'">'+esc(e.type)+'</span><span class="'+(off?"dn":(on?"ok":"dim"))+'" style="font-size:9px;font-weight:800">'+lab+'</span><span class="spacer"></span><span class="dim" style="font-size:10px">'+esc(e.chan)+'</span></div><div class="esnip">'+esc(e.snip)+'</div></div>';
    }).join(""):'<div class="sub">no events.</div>')+'</div>';
  h+='<h2>Emerging narratives — novel terms</h2><div class="card"><div class="chips2">'
    +((N.emerging&&N.emerging.length)?N.emerging.map(function(e){return '<span class="chip2'+(e.isNew?" cnew":"")+'">'+(e.isNew?'<span class="nbx">NEW</span>':'')+esc(e.w)+'<span class="cc">'+e.C+' ch · '+e.n+'×</span></span>';}).join(""):'<span class="sub">none</span>')
    +'</div></div>';
  h+='<h2>Trending alts — $tickers by channels</h2><div class="card"><div class="chips2">'
    +((N.alts&&N.alts.length)?N.alts.map(function(a){return '<span class="chip2'+(a.isNew?" cnew":"")+'">'+(a.isNew?'<span class="nbx">NEW</span>':'')+'<b>'+esc(a.tk)+'</b><span class="cc">'+a.C+' ch · '+a.n+'×</span></span>';}).join(""):'<span class="sub">none</span>')
    +'</div></div>';
  document.getElementById("tab-news").innerHTML=h;
}

renderLive(); renderForecast(); renderNews(); renderRobots(); renderHealth();
var tabs=["live","forecast","news","robots","health"];
document.querySelectorAll("nav button").forEach(function(b){ b.onclick=function(){
  var t=b.dataset.t; tabs.forEach(function(x){ document.getElementById("tab-"+x).classList.toggle("hide",x!==t); });
  document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x===b);});
  window.scrollTo(0,0); if(TG&&TG.HapticFeedback){try{TG.HapticFeedback.selectionChanged();}catch(e){}}
};});
</script></body></html>
